<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">   
    <title>Sign-up Form</title>
</head>
<body>
    <div class="picture-part">
        <img class="background-image" src="./pictures/wet.jpg" alt="Picture of a tropical leaves">
        <div class="logo-banner">
            <img src="./pictures/odin-lined.png" alt="The Odin Project Logo">
            <span>ODIN</span>
        </div>
    </div>
    <div class="content-part">
        <div class="header">
            <h1>
                This is not a real online service! 
                You know you need something like this in your life to help you realize your deepest dreams.
                Sign up now to get started.
            </h1>
            <h2>You know you want to.</h2>
        </div>
        <div class="form">
            <h1>Let's do This!</h1>
            <form action="#" method="post">
                <fieldset>
                    <div>
                        <section>
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first" required>
                        </section>
                        <section>
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </section>
                        <section>
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </section>
                    </div>
                    <div>
                        <section>
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last" required>
                        </section>
                        <section>
                            <label for="phone">Phone</label>
                            <input type="tel" id="phone" name="phone">
                        </section>
                        <section>
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" required>
                        </section>
                    </div>
                </fieldset>
                <button type="submit">Create Account</button>
                <p>Already have an account? Log in</p>
            </form>
        </div>
    </div>
</body>
</html>
